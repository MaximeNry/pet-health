packages:
  - 'apps/*'
  - 'packages/*'
allowBuilds:
  '@nestjs/core': false
  '@parcel/watcher': false
  '@prisma/engines': true
  '@swc/core': false
  argon2: true
  esbuild: true
  prisma: true
  sharp: false
  unrs-resolver: false

# Advisories the `audit` CI job is allowed to skip. Every entry must be a high
# severity finding on a transitive dependency that is version-pinned by an
# upstream package, so no change in this repo can move it, with the reason it
# is accepted. The job is blocking: anything NOT listed here fails CI. Re-check
# this list whenever Dependabot bumps next or prisma — an entry that no longer
# applies must be deleted, not left to hide a future finding. Empty since
# next 16.4.2 and prisma 7.10.1 moved every previously listed package.
auditConfig:
  ignoreGhsas: []
