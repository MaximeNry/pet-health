services:
  # ── Database ─────────────────────────────────────────────────────
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "${DB_PORT:-5432}:5432"
    # Named volume = the data survives `docker compose down`.
    # Without it, every restart would begin with an empty database.
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Healthcheck: compose waits for Postgres to be READY, not merely for
    # the container to have started. Without it the API crashes on boot
    # because it tries to connect before PG accepts connections.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ── NestJS API ───────────────────────────────────────────────────
  api:
    build:
      context: .                # context = the monorepo root (pnpm needs
      dockerfile: Dockerfile.dev # pnpm-lock.yaml + every package.json)
    # Prisma client is generated at build time (see Dockerfile.dev, layer 5).
    command: ["pnpm", "--filter", "api", "start:dev"]
    ports:
      - "3000:3000"
    environment:
      # "postgres" here = the name of the service above. Docker Compose
      # creates an internal network where each service is reachable by name.
      # That is THE networking concept to remember: no localhost between
      # containers, the service name is the hostname.
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}
      NODE_ENV: development
      # Auth (Google OAuth + app session). Values come from the root .env.
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL:-http://localhost:3000/auth/google/callback}
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3001}
      # Where scanned documents go: "drive" (user's Google Drive) or "local"
      # (container disk). Empty = drive in production, local in development.
      DOCUMENT_STORAGE: ${DOCUMENT_STORAGE:-}
    # Bind mounts: the host source code is mounted into the container.
    # Editing a file on the host is seen by the container instantly →
    # hot reload. OrbStack handles this well through VirtioFS.
    # ONLY the source folders are mounted, not the whole monorepo, so that
    # the node_modules installed inside the container is not shadowed.
    volumes:
      - ./apps/api/src:/app/apps/api/src
      - ./packages/shared/src:/app/packages/shared/src
    depends_on:
      postgres:
        # condition: service_healthy → waits for the healthcheck, not just
        # for the container to start. This is the right practice.
        condition: service_healthy

  # ── Next.js frontend ─────────────────────────────────────────────
  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    # -H 0.0.0.0: by default `next dev` listens on localhost, which inside
    # a container means unreachable from outside. Binding every interface
    # is what makes the port mapping work.
    # --webpack (not --turbopack): Turbopack 16.2.x crash-loops on this
    # pnpm+Docker layout (HMR: "Next.js package not found", because `next`
    # is not hoisted into /app/node_modules). Webpack resolves it correctly.
    command: ["pnpm", "--filter", "web", "exec", "next", "dev", "--webpack", "-H", "0.0.0.0"]
    ports:
      - "3001:3000"
    environment:
      NODE_ENV: development
      # Base URL of the API, as seen from the browser (host port mapping).
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3000}
    volumes:
      - ./apps/web/src:/app/apps/web/src
      # i18n messages are loaded at runtime by next-intl; mount them so new
      # keys hot-reload like source files instead of requiring a rebuild.
      - ./apps/web/messages:/app/apps/web/messages
      # Static assets (PWA icons, manifest assets…) served by next dev.
      - ./apps/web/public:/app/apps/web/public
      - ./packages/shared/src:/app/packages/shared/src
    depends_on:
      - api

# Named volume declared at the top level: Docker manages it (creation,
# storage). It outlives `docker compose down`. To remove it:
# `docker compose down -v` (the -v destroys named volumes).
volumes:
  pgdata:
