name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Advisories land after the code is written: rescan the codebase weekly with
  # the up-to-date query pack.
  schedule:
    - cron: '0 6 * * 1'

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze JavaScript/TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
      # Required to upload the results to the Security tab.
      security-events: write
    steps:
      - uses: actions/checkout@v5

      - uses: github/codeql-action/init@v3
        with:
          # A single language covers both apps: CodeQL analyses TS as JS and
          # needs no build step for it.
          languages: javascript-typescript
          queries: security-and-quality

      - uses: github/codeql-action/analyze@v3
